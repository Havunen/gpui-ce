name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Ubuntu 24.04 x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Ubuntu 22.04 aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Ubuntu 24.04 aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS 14 aarch64
            runner: macos-14
            target: aarch64-apple-darwin
          - name: macOS 15 x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS 15 aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS 26 x86_64
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - name: macOS 26 aarch64
            runner: macos-26
            target: aarch64-apple-darwin
          - name: Windows Server 2022 x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - name: Windows Server 2025 x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: Windows Server 2025 VS2026 x86_64
            runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
          - name: Windows 11 aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust-${{ matrix.runner }}-${{ matrix.target }}
          cache-bin: false

      - name: Free disk space on Linux
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get autoremove --purge -y
          sudo apt-get clean
          df -h /

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            pkg-config \
            libasound2-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgbm-dev \
            libgles2-mesa-dev \
            libssl-dev \
            libva-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            lld \
            mesa-vulkan-drivers \
            zlib1g-dev

      - name: Build workspace
        run: cargo build --workspace --lib --bins --examples --target ${{ matrix.target }}

      - name: Run tests
        # Keep the unresolved native access-violation workaround on Windows only.
        run: cargo test --workspace --lib --tests --target ${{ matrix.target }} ${{ (runner.os == 'macOS' || runner.os == 'Windows') && '--features gpui_ce_wgpu/test-support,gpui_ce_wgpu/custom-gpu,gpui_ce_wgpu/wgpu-surfaces' || '' }} -- ${{ runner.os == 'Windows' && '--test-threads=1' || '' }}

      - name: Run Vulkan shader rendering tests
        if: runner.os == 'Linux'
        env:
          GPUI_REQUIRE_VULKAN_TESTS: "1"
        run: cargo test -p gpui_ce_wgpu --features test-support --lib vulkan --target ${{ matrix.target }} -- --test-threads=1

      - name: Run OpenGL primitive rendering tests
        if: matrix.runner == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          WGPU_BACKEND: gl
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: cargo test --locked -p gpui_ce_wgpu --features test-support --test headless_primitives --target ${{ matrix.target }} -- --test-threads=1

      - name: Run native X11 OpenGL renderer test
        if: matrix.runner == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a env -u WGPU_BACKEND -u WAYLAND_DISPLAY -u ZED_HEADLESS \
            cargo test --locked -p gpui_ce_linux --no-default-features --features x11 \
            --test linux_renderer --target ${{ matrix.target }} -- --ignored --test-threads=1

      - name: Run release DX12 shader tests
        if: matrix.runner == 'windows-2025'
        run: cargo test --locked -p gpui_ce_wgpu --release --features test-support,custom-gpu,wgpu-surfaces --lib precompiled_shader_tests --target ${{ matrix.target }} -- --test-threads=1

      - name: Run profiler tests
        run: |
          cargo test -p gpui-ce --features profiler --lib profiler:: --target ${{ matrix.target }} -- ${{ runner.os == 'Windows' && '--test-threads=1' || '' }}

  ubuntu-container-build:
    name: Ubuntu ${{ matrix.ubuntu_version }} container x86_64
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:${{ matrix.ubuntu_version }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version:
          - "26.04"
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install bootstrap and system dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            git \
            libasound2-dev \
            libdrm-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgbm-dev \
            libssl-dev \
            libva-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            lld \
            mesa-vulkan-drivers \
            pkg-config \
            zlib1g-dev \
            zstd

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
            -y \
            --profile minimal \
            --default-toolchain stable \
            --target x86_64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust-container-ubuntu-${{ matrix.ubuntu_version }}-x86_64-unknown-linux-gnu
          cache-bin: false

      - name: Build workspace
        run: cargo build --workspace --lib --bins --examples --target x86_64-unknown-linux-gnu

      - name: Run tests
        run: cargo test --workspace --lib --tests --target x86_64-unknown-linux-gnu

      - name: Run profiler tests
        run: |
          cargo test -p gpui-ce --features profiler --lib profiler:: --target x86_64-unknown-linux-gnu

  check-target-variations:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 x86_64 headless
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            check_targets: --lib
            cargo_args: --no-default-features
          - name: Ubuntu 24.04 x86_64 Wayland
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            check_targets: --all-targets
            cargo_args: --no-default-features --features wayland
          - name: Ubuntu 24.04 x86_64 X11
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            check_targets: --all-targets
            cargo_args: --no-default-features --features x11
          - name: Ubuntu 22.04 aarch64 headless
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            check_targets: --lib
            cargo_args: --no-default-features
          - name: Ubuntu 24.04 x86_64 musl headless
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            check_targets: --lib
            target_cc: gcc
            target_linker: musl-gcc
            cargo_args: --no-default-features
          - name: Windows Server 2022 i686 MSVC headless
            runner: windows-2022
            target: i686-pc-windows-msvc
            check_targets: --lib
            cargo_args: --no-default-features
          # The default Windows build has no WGPU renderer; apps may opt in.
          - name: Windows Server 2025 x86_64 WGPU
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            check_targets: --all-targets
            cargo_args: --features gpui_ce_windows/windows-wgpu,gpui_ce_wgpu/custom-gpu,gpui_ce_wgpu/wgpu-surfaces
          - name: macOS 14 aarch64 WGPU
            runner: macos-14
            target: aarch64-apple-darwin
            check_targets: --all-targets
            cargo_args: --features gpui_ce_platform/macos-wgpu,gpui_ce_wgpu/custom-gpu,gpui_ce_wgpu/wgpu-surfaces

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust-${{ matrix.runner }}-${{ matrix.target }}
          cache-bin: false

      - name: Free disk space on Linux
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get autoremove --purge -y
          sudo apt-get clean
          df -h /

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            pkg-config \
            libasound2-dev \
            libdrm-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgbm-dev \
            libssl-dev \
            libva-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            lld \
            musl-tools \
            zlib1g-dev

      - name: Check workspace
        env:
          CC_x86_64_unknown_linux_musl: ${{ matrix.target_cc || '' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.target_linker || '' }}
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: cargo check --workspace ${{ matrix.check_targets }} --target ${{ matrix.target }} ${{ matrix.cargo_args }}

  web:
    name: WebGPU and WebGL2 compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Check browser backend
        run: cargo check --locked -p gpui_ce_web -p gpui_ce_platform --target wasm32-unknown-unknown
      - name: Check shared-memory web example
        working-directory: crates/gpui_web/examples/hello_web
        run: cargo check --target wasm32-unknown-unknown

  # Components live in their own repository. Check current main against this
  # checkout, but make drift visible as annotations rather than a merge gate.
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: gpui-ce/gpui-component
          path: gpui-component
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xinput-dev \
            libxkbcommon-x11-dev libegl1-mesa-dev \
            libgles2-mesa-dev libglib2.0-dev libfontconfig-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev
      - name: Check component compatibility (warning only)
        shell: bash
        run: |
          component_dir="$GITHUB_WORKSPACE/gpui-component"
          component_patch_args=(
            --config "patch.crates-io.gpui-ce.path=\"$GITHUB_WORKSPACE/crates/gpui\""
            --config "patch.crates-io.gpui_ce_platform.path=\"$GITHUB_WORKSPACE/crates/gpui_platform\""
            --config "patch.crates-io.gpui_ce_web.path=\"$GITHUB_WORKSPACE/crates/gpui_web\""
            --config "patch.crates-io.gpui_ce_macros.path=\"$GITHUB_WORKSPACE/crates/gpui_macros\""
          )
          warn() {
            echo "::warning title=Component compatibility::$1"
          }

          if ! (cd "$component_dir" && cargo "${component_patch_args[@]}" build --workspace --all-targets); then
            warn "gpui-ce/gpui-component main does not currently build against this GPUI checkout."
          elif ! (cd "$component_dir" && cargo "${component_patch_args[@]}" test --workspace --no-fail-fast); then
            warn "gpui-ce/gpui-component tests do not currently pass against this GPUI checkout."
          fi
